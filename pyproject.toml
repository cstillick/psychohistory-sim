[project]
name = "policysim"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "duckdb>=1.5.3",
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "policyengine-us>=1.726.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
markers = ["slow: full PolicyEngine runs", "apikey: needs ANTHROPIC_API_KEY"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
